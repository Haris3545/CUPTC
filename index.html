<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CUPTC — Cambridge University Padel Club</title>
  <meta name="description" content="Cambridge University Padel Club. Our full website is coming soon.">
  <meta name="theme-color" content="#FBF8F1">

  <meta property="og:type" content="website">
  <meta property="og:title" content="CUPTC — Cambridge University Padel Club">
  <meta property="og:description" content="Full website coming soon.">
  <meta property="og:image" content="assets/img/cuptc-logo.png">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="assets/css/landing.css">
  <link rel="prefetch" href="play/">
</head>
<body>
  <main class="page">
    <header class="masthead reveal" style="--d: .05s">
      <img class="logo" src="assets/img/cuptc-logo.png" width="1312" height="352"
           alt="CUPTC — Cambridge University Padel Club" fetchpriority="high">
    </header>

    <div class="ornament reveal" style="--d: .3s" aria-hidden="true"><span></span></div>

    <section class="announce">
      <h1 class="headline reveal" style="--d: .45s">Full Website <em>Coming Soon</em></h1>

      <div class="reveal" style="--d: .7s">
        <a class="cta" href="play/" id="cta">
          <span class="cta-label">To Tide You Over</span>
          <span class="cta-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/>
            </svg>
          </span>
        </a>
      </div>
    </section>
  </main>

  <footer class="foot reveal" style="--d: .95s">Cambridge University Padel Club</footer>

  <script src="assets/js/landing.js" defer></script>
</body>
</html>
